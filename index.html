<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Support</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background: #f5f7fa;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 80px auto;
      padding: 40px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin-bottom: 16px;
      font-size: 28px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      color: #007aff;
      text-decoration: none;
      font-weight: 500;
    }

    footer {
      margin-top: 30px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌱 Support</h1>

    <p>
      Vielen Dank, dass du meine App nutzt!  
      Bei Fragen, Problemen oder Feedback erreichst du mich jederzeit per E-Mail.
    </p>

    <a class="email">rk.works.digital [at] gmail.com</a>

    <footer>
      © 2026 Rebecca Krummel
    </footer>
  </div>
  <script>
    // Builds the email link in the browser so the raw address never appears in the HTML.
    document.querySelectorAll(".email").forEach(function (el) {
      var addr = ["rk.works.digital", "gmail.com"].join("@");
      var a = el;
      if (el.tagName !== "A") {
        a = document.createElement("a");
        a.style.margin = "0";
        a.style.display = "inline";
        el.replaceWith(a);
      }
      a.href = "mailto:" + addr;
      a.textContent = addr;
    });
  </script>
</body>
</html>
